<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Rubik:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ── Concept animation — RavTech theme, authored at 1280×720 and scaled to fit ──
   This is the "explain the mechanism" form: panels laid out for the concept,
   highlights / arrows / badges per scene, a caption footer, a recap card.
   Content is defined in the CONFIG script at the bottom; the engine is generic. */
:root{
  --navy:#0a1f3d;--navy-deep:#061530;--dim:#0e2748;--dim-2:#132f56;
  --blue:#1e4d8b;--cyan:#00c8ff;--accent:#ff7a00;--red:#dc4b3e;--green:#2bbd7e;
  --text:#e8f0fa;--text-soft:#b7c6da;--text-muted:#7c8aa3;--border:#22406b;
  --ui:'Heebo',system-ui,-apple-system,sans-serif;--head:'Rubik',var(--ui);
  --mono:'JetBrains Mono','Courier New',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--navy-deep);color:var(--text);font-family:var(--ui)}
body{overflow:hidden}
#wrap{position:fixed;inset:0}
.stage{position:absolute;left:0;top:0;width:1280px;height:720px;background:var(--navy);transform-origin:top left;overflow:hidden;
  background-image:radial-gradient(ellipse at 20% 0%,rgba(0,200,255,.10),transparent 55%),radial-gradient(ellipse at 100% 100%,rgba(255,122,0,.08),transparent 50%)}
.mono,code,.code,.term{font-family:var(--mono);direction:ltr;unicode-bidi:isolate}
.stage.noanim *{transition:none!important;animation:none!important}
.stage.noanim .tl{opacity:1;transform:none}

/* header */
.hdr{position:absolute;left:0;top:0;right:0;height:56px;display:flex;align-items:center;gap:16px;padding:0 24px;border-bottom:1px solid var(--border)}
.hdr .kick{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);font-weight:700;white-space:nowrap}
.hdr h1{margin:0;font-size:20px;font-weight:700;font-family:var(--head);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .path{margin-left:auto;font-size:12px;color:var(--text-muted);white-space:nowrap}
.hdr .path b{color:var(--text-soft);font-weight:600}
.hdr .deeplink{color:var(--cyan);text-decoration:none;border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.hdr .deeplink:hover{border-color:var(--cyan);background:rgba(0,200,255,.08)}

/* panels */
.panel{position:absolute;background:var(--dim);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:box-shadow .5s,border-color .5s,opacity .5s;opacity:.72;display:flex;flex-direction:column}
.panel.on{opacity:1;border-color:var(--cyan);box-shadow:0 0 0 1px rgba(0,200,255,.35),0 18px 40px rgba(0,0,0,.35)}
.panel.hot{opacity:1;border-color:var(--red);box-shadow:0 0 0 1px rgba(220,75,62,.45),0 18px 40px rgba(0,0,0,.35)}
.panel.good{opacity:1;border-color:var(--green);box-shadow:0 0 0 1px rgba(43,189,126,.4),0 18px 40px rgba(0,0,0,.35)}
.panel.hidden{opacity:0;pointer-events:none}
.pbar{display:flex;align-items:center;gap:8px;height:26px;padding:0 12px;background:rgba(0,0,0,.25);border-bottom:1px solid var(--border);font-size:11.5px;color:var(--text-soft);flex:none;position:relative}
.pbar .dot{width:9px;height:9px;border-radius:50%;background:#2a4a75}
.pbar .dot:first-child{background:var(--cyan)}
.pbar .nm{font-family:var(--mono);color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar .tag{margin-left:auto;flex:none;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);white-space:nowrap}
.pbar .tag.live{color:var(--accent);font-weight:700}
.pbadge{display:none;flex:none;margin-left:8px;font-size:10.5px;font-weight:800;padding:1px 9px;border-radius:20px;font-family:var(--mono);white-space:nowrap;animation:pop .35s ease-out}
.pbadge.show{display:inline-block}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.pbadge.red{background:var(--red);color:#fff}.pbadge.green{background:var(--green);color:#04261a}.pbadge.orange{background:var(--accent);color:#1a0d00}.pbadge.cyan{background:var(--cyan);color:var(--navy)}
.pbody{flex:1;min-height:0;overflow:hidden;position:relative}

/* code panel */
.code{padding:4px 0;font-size:11.5px;line-height:17px;color:#c9d6e8;white-space:pre}
.ln{display:flex;padding:0 6px 0 0;border-left:3px solid transparent;transition:background .35s,border-color .35s,color .35s}
.ln .n{width:32px;flex:none;text-align:right;padding-right:8px;color:#4e6a92;user-select:none}
.ln .c{white-space:pre;overflow:hidden;text-overflow:ellipsis}
.ln.hl{background:rgba(0,200,255,.13);border-left-color:var(--cyan);color:#fff}
.ln.hot{background:rgba(220,75,62,.20);border-left-color:var(--red);color:#fff}
.ln.ok{background:rgba(43,189,126,.16);border-left-color:var(--green);color:#fff}
.ln .k{color:#7fd8ff}.ln .s{color:#ffd28a}.ln .cm{color:#6f86a8;font-style:italic}.ln .num{color:#c9b5ff}

/* terminal / session panel */
.term{padding:10px 14px;font-size:12.5px;line-height:19px;color:#d8e3f2;height:100%;overflow:hidden;white-space:pre-wrap;word-break:break-word;display:flex;flex-direction:column;justify-content:flex-end}
.tl{opacity:0;transform:translateY(6px);transition:opacity .45s,transform .45s}
.tl.show{opacity:1;transform:none}
.tl.u{color:#fff;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:6px;padding:4px 9px;margin:6px 0 3px}.tl.u b{color:var(--cyan)}
.tl.cl{color:#e8f0fa}.tl.cl .b{color:var(--accent)}
.tl.tool{color:#fff;font-weight:700}.tl.tool .b{color:var(--accent)}
.tl.res{color:var(--text-soft);padding-left:20px}
.tl.err{color:#ffb3aa;padding-left:20px}.tl.err b{color:#ff6f60}
.tl.okr{color:#9fe8c6;padding-left:20px}
.tl.hook{color:#ffc98a;padding-left:20px}
.tl.sh{color:#fff}.tl.sh::before{content:'$ ';color:var(--cyan)}
.tl.out{color:var(--text-muted)}
.tl.dim{color:var(--text-muted)}
.tl.gap{height:8px}
.badge{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:20px;font-size:10.5px;font-weight:700;letter-spacing:.05em;vertical-align:1px;font-family:var(--ui)}
.badge.wait{background:rgba(255,122,0,.18);color:var(--accent);border:1px solid rgba(255,122,0,.5)}
.badge.blk{background:rgba(220,75,62,.2);color:#ff8d80;border:1px solid rgba(220,75,62,.6)}
.badge.ok{background:rgba(43,189,126,.18);color:#7fe0b3;border:1px solid rgba(43,189,126,.55)}
.badge.info{background:rgba(0,200,255,.14);color:var(--cyan);border:1px solid rgba(0,200,255,.4)}
.cursor{display:inline-block;width:8px;height:14px;background:var(--cyan);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* state panel (free html: slots, chips, tables) */
.state{padding:10px 12px;font-size:12px;line-height:1.5;height:100%;overflow:hidden}
.slot{border-radius:8px;border:1px solid var(--border);padding:6px 10px;margin-bottom:6px;display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;background:rgba(0,0,0,.14);transition:border-color .4s,background .4s,opacity .4s}
.slot .n{font-family:var(--mono);font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .k{font-size:10.5px;color:var(--text-muted);grid-column:1/3}
.slot .v{font-family:var(--mono);font-size:11px;color:var(--text-muted);white-space:nowrap}
.slot.on{border-color:rgba(0,200,255,.55);background:rgba(0,200,255,.08)}.slot.on .v{color:var(--cyan)}
.slot.ghost{border-style:dashed;opacity:.55}
.slot.good{border-color:rgba(43,189,126,.5);background:rgba(43,189,126,.07)}.slot.good .v{color:var(--green)}
.slot.bad{border-color:rgba(220,75,62,.5);background:rgba(220,75,62,.08)}.slot.bad .v{color:#ff8d80}
.chip{display:inline-block;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;border-radius:4px;padding:1px 6px;line-height:1.5;margin-left:6px}
.chip.cy{background:rgba(0,200,255,.14);color:var(--cyan);border:1px solid rgba(0,200,255,.35)}
.chip.or{background:rgba(255,122,0,.12);color:#ffb26b;border:1px solid rgba(255,122,0,.4)}
.chip.gr{background:rgba(43,189,126,.14);color:#7fe0b3;border:1px solid rgba(43,189,126,.4)}
.chip.rd{background:rgba(220,75,62,.14);color:#ff8d80;border:1px solid rgba(220,75,62,.4)}
.state table{border-collapse:collapse;width:100%;font-size:11.5px}
.state td,.state th{padding:4px 6px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
.state th{color:var(--text-muted);font-weight:600;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.state code{background:rgba(255,255,255,.07);padding:0 4px;border-radius:3px;font-size:11px}
.big{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--text)}

/* floating cards (a payload, a callout) */
.card{position:absolute;background:#08172e;border:1px solid var(--accent);border-radius:10px;box-shadow:0 14px 34px rgba(0,0,0,.5);opacity:0;transform:translateX(24px) scale(.96);transition:opacity .5s,transform .5s;pointer-events:none;z-index:5}
.card.show{opacity:1;transform:none}
.card.cy{border-color:var(--cyan)}.card.cy .ct{color:var(--cyan);border-bottom-color:rgba(0,200,255,.35)}
.card .ct{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);padding:7px 12px;border-bottom:1px solid rgba(255,122,0,.35);font-weight:700}
.card .ct span{color:var(--text-muted);letter-spacing:0;text-transform:none;font-weight:400;margin-left:8px}
.card pre{margin:0;padding:8px 12px 10px;font-size:11.5px;line-height:17px;color:#d8e3f2;font-family:var(--mono)}
.card .k{color:#7fd8ff}.card .s{color:#ffd28a}.card .hi{background:rgba(220,75,62,.28);color:#fff;border-radius:3px;padding:0 3px}.card .hi.ok{background:rgba(43,189,126,.3)}
.card .body{padding:10px 12px;font-size:12.5px;color:var(--text-soft);line-height:1.45}

/* arrows */
#arrows{position:absolute;inset:0;pointer-events:none;z-index:6}
#arrows path{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:8 6;opacity:0;transition:opacity .4s}
#arrows path.show{opacity:1;animation:dash 1.2s linear infinite}
#arrows path.cy{stroke:var(--cyan)}#arrows path.or{stroke:var(--accent)}#arrows path.rd{stroke:var(--red)}#arrows path.gr{stroke:var(--green)}
#arrows text{font-family:var(--mono);font-size:11px;font-weight:700;fill:#fff;opacity:0;transition:opacity .4s}
#arrows text.show{opacity:1}
#arrows rect{fill:var(--navy);opacity:0;transition:opacity .4s}#arrows rect.show{opacity:.95}
@keyframes dash{to{stroke-dashoffset:-28}}

/* footer / caption */
.foot{position:absolute;left:0;right:0;bottom:0;height:116px;border-top:1px solid var(--border);background:rgba(6,21,48,.85);backdrop-filter:blur(6px);padding:12px 24px 10px;display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start}
.stepno{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:800}
.stepno span{color:var(--text-muted);font-weight:500;letter-spacing:0;text-transform:none;margin-left:8px}
.captitle{font-size:19px;font-weight:700;font-family:var(--head);margin:2px 0 4px;letter-spacing:-.01em}
.caption{font-size:13.5px;line-height:1.45;color:var(--text-soft);max-width:900px}
.caption code{background:rgba(255,255,255,.08);color:#fff;padding:0 5px;border-radius:4px;font-size:12px}
.caption em{color:var(--accent);font-style:normal;font-weight:600}
.ctrls{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.btns{display:flex;gap:6px}
.btn{cursor:pointer;background:var(--dim-2);border:1px solid var(--border);color:#fff;font:600 12px var(--ui);padding:6px 11px;border-radius:8px}
.btn:hover{border-color:var(--cyan)}
.btn.play{background:var(--cyan);color:var(--navy);border-color:var(--cyan);min-width:74px}
.btn.rst{color:var(--text-soft)}
select.btn{padding:5px 8px}
.dots{display:flex;gap:5px}
.dots i{width:14px;height:6px;border-radius:3px;background:#22406b;cursor:pointer;transition:background .3s,width .3s}
.dots i.done{background:var(--blue)}.dots i.now{background:var(--cyan);width:24px}
.keys{font-size:10.5px;color:var(--text-muted)}
.keys b{color:var(--text-soft);font-weight:600;background:rgba(255,255,255,.07);padding:0 5px;border-radius:3px}
.prog{position:absolute;left:0;bottom:0;height:3px;background:var(--cyan);width:0;transition:width .3s linear}

/* recap overlay */
#recap{position:absolute;left:96px;top:86px;width:1088px;height:480px;background:rgba(6,21,48,.96);border:1px solid var(--cyan);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.55);padding:26px 32px;opacity:0;transform:translateY(16px);transition:opacity .5s,transform .5s;pointer-events:none;z-index:8}
#recap.show{opacity:1;transform:none}
#recap h2{margin:0 0 4px;font-size:24px;font-weight:700;font-family:var(--head)}
#recap .sub{color:var(--text-soft);font-size:13.5px;margin-bottom:18px}
#recap .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
#recap .rcard{background:var(--dim);border:1px solid var(--border);border-radius:12px;padding:14px 16px;min-height:200px}
#recap .rcard h3{margin:0 0 10px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan)}
#recap .rcard ul{margin:0;padding-left:16px;font-size:13px;line-height:1.5;color:var(--text-soft)}
#recap .rcard li{margin-bottom:6px}
#recap .rcard b{color:#fff}
#recap code{background:rgba(255,255,255,.08);color:#fff;padding:0 5px;border-radius:4px;font-size:11.5px}
#recap .try{margin-top:16px;background:#08172e;border:1px dashed var(--accent);border-radius:10px;padding:10px 14px;font-size:12.5px;color:#fff}
#recap .try .lbl{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:800;margin-right:10px}
</style>
</head>
<body>
<div id="wrap"><div class="stage" id="stage">
  <div class="hdr"><span class="kick" id="kick"></span><h1 id="title"></h1><span class="path" id="pathlbl"></span><a class="deeplink" id="deepLink" hidden target="_blank" rel="noopener"></a></div>
  <div id="panels"></div>
  <div id="cards"></div>
  <svg id="arrows" width="1280" height="720"></svg>
  <div id="recap"></div>
  <div class="foot">
    <div><div class="stepno"><span id="stepNo"></span></div><div class="captitle" id="capTitle"></div><div class="caption" id="capText"></div></div>
    <div class="ctrls">
      <div class="btns"><button class="btn rst" id="bRst">⟲</button><button class="btn" id="bPrev">◀</button><button class="btn play" id="bPlay">▶ Play</button><button class="btn" id="bNext">▶</button>
        <select class="btn" id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></div>
      <div class="dots" id="dots"></div>
      <div class="keys"><b>Space</b> play/pause · <b>← →</b> step · <b>R</b> restart · <b>F</b> fullscreen</div>
    </div>
    <div class="prog" id="prog"></div>
  </div>
</div></div>

<script>/* config errors show on the stage instead of a blank page */
window.addEventListener('error',function(e){var d=document.createElement('div');d.style.cssText='position:fixed;left:12px;top:12px;right:12px;z-index:99;background:#dc4b3e;color:#fff;font:600 14px/1.4 Heebo,system-ui,sans-serif;padding:10px 14px;border-radius:8px;white-space:pre-wrap';d.textContent='Config error: '+e.message+(e.lineno?' (line '+e.lineno+')':'');document.body.appendChild(d);});</script>
<script id="conceptConfig">
/* ══════════════════════════════════════════════════════════════════════════
   CONFIG — this is the only block a demo author edits.
   See references/concept-animation.md for the vocabulary and the rules.
   ══════════════════════════════════════════════════════════════════════════ */
window.CONCEPT = {
  meta: {
    kicker: 'Topic · Concept animation',
    title: 'What this demo explains',
    path: 'projects/<project> · <file> → <file>',
    deepDive: null, // {href:'<slug>-deep-dive.html', label:'Deep dive'}
  },
  /* Panels are absolutely positioned on a 1280×720 stage; the footer takes the
     bottom 116px, the header the top 56px → usable area y 72..606. */
  panels: [
    // {id:'src', kind:'code', title:'.claude/settings.json', tag:'where it is wired', x:20,y:72,w:548,h:230, lang:'json', lines:[...]}
    // {id:'sess', kind:'term', title:'claude · project', tag:'session', x:604,y:72,w:656,h:534, welcome:'…'}
    // {id:'ctx', kind:'state', title:'context window', tag:'', x:…, html:'…'}
  ],
  /* Cards float above panels: {id:'payload', x,y,w, cls:'or'|'cy', title:'…', sub:'…', pre:'<html>' | body:'<html>'} */
  cards: [],
  /* Terminal lines the steps can append by key: {c:'u'|'cl'|'tool'|'res'|'err'|'okr'|'hook'|'sh'|'out'|'dim'|'gap', h:'<html>'} */
  lines: {},
  /* Steps (scenes). Each: {title, cap, dur, panels:{id:{on,hot,good,hl:[],hotl:[],okl:[],badge:{text,cls},tag}}, term:{id:['lineKey',…]}, cards:['id'], arrows:[{from:{panel,line}|{card}|{sel}, to:{…}, cls:'cy'|'or'|'rd'|'gr', label, fromSide:'r'|'l', toSide:'l'|'r', rail:<x>}], recap:'<html>'} */
  steps: [],
};
</script>
<script>
(function(){
"use strict";
const C=window.CONCEPT, $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function colorize(s,lang){
  if(lang==='raw') return s; // author supplies spans
  let code=s, cm='';
  const m = (lang==='sh'||lang==='py'||lang==='yaml'||lang==='toml') ? s.match(/^(.*?)(\s{2,}#.*|^#.*)$/) : s.match(/^(.*?)(\s+\/\/.*|^\s*\/\/.*|^\s*\*.*|^\s*\/\*.*)$/);
  if(m){code=m[1];cm=m[2]}
  let h=esc(code).replace(/"((?:[^"\\]|\\.)*)"/g,'<span class="s">"$1"</span>').replace(/'((?:[^'\\]|\\.)*)'/g,'<span class="s">\'$1\'</span>');
  if(lang==='sh') h=h.replace(/(^|[\s(|;&])(block|matches|exit|jq|grep|printf|cat|set|if|then|fi|echo|export|local|return)(?=[\s(;]|$)/g,'$1<span class="k">$2</span>');
  else if(lang==='ts'||lang==='js') h=h.replace(/\b(import|export|from|const|let|var|function|return|if|else|async|await|new|class|extends|default|type|interface|throw|try|catch)\b/g,'<span class="k">$1</span>');
  else if(lang==='py') h=h.replace(/\b(import|from|def|class|return|if|elif|else|for|in|while|with|as|try|except|raise|async|await|lambda|None|True|False)\b/g,'<span class="k">$1</span>');
  else if(lang==='json'||lang==='yaml') h=h.replace(/\b(true|false|null)\b/g,'<span class="k">$1</span>');
  h=h.replace(/(^|[\s:,\[(])(-?\d+(?:\.\d+)?)(?=[\s,\]})]|$)/g,'$1<span class="num">$2</span>');
  return h+(cm?'<span class="cm">'+esc(cm)+'</span>':'');
}
/* build panels */
const P={};
C.panels.forEach(p=>{
  const el=document.createElement('div'); el.className='panel'; el.id='p-'+p.id;
  el.style.cssText=`left:${p.x}px;top:${p.y}px;width:${p.w}px;height:${p.h}px`;
  let body='';
  if(p.kind==='code') body=`<div class="code">${(p.lines||[]).map((l,i)=>`<div class="ln" data-l="${p.id}:${i+1}"><span class="n">${i+1}</span><span class="c">${colorize(l,p.lang||'txt')}</span></div>`).join('')}</div>`;
  else if(p.kind==='term') body=`<div class="term" id="t-${p.id}"></div>`;
  else body=`<div class="state" id="s-${p.id}">${p.html||''}</div>`;
  el.innerHTML=`<div class="pbar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="nm">${esc(p.title||'')}</span><span class="tag" id="tag-${p.id}">${esc(p.tag||'')}</span><span class="pbadge" id="badge-${p.id}"></span></div><div class="pbody">${body}</div>`;
  $('panels').appendChild(el); P[p.id]=p;
});
C.cards.forEach(c=>{
  const el=document.createElement('div'); el.className='card '+(c.cls||''); el.id='c-'+c.id;
  el.style.cssText=`left:${c.x}px;top:${c.y}px;width:${c.w||420}px`;
  el.innerHTML=`<div class="ct">${esc(c.title||'')}${c.sub?'<span>'+esc(c.sub)+'</span>':''}</div>`+(c.pre?`<pre>${c.pre}</pre>`:`<div class="body">${c.body||''}</div>`);
  $('cards').appendChild(el);
});
/* header */
$('kick').textContent=C.meta.kicker||''; $('title').textContent=C.meta.title||''; document.title=C.meta.title||document.title;
$('pathlbl').innerHTML=C.meta.path||'';
if(C.meta.deepDive&&C.meta.deepDive.href){const d=$('deepLink');d.href=C.meta.deepDive.href;d.textContent='📄 '+(C.meta.deepDive.label||'Deep dive')+' ↗';d.hidden=false;}
/* steps */
const STEPS=C.steps; let si=0, playing=false, timer=null, progT=null;
const dots=$('dots');
STEPS.forEach((s,i)=>{const d=document.createElement('i');d.title=s.title||'';d.onclick=()=>{pause();go(i)};dots.appendChild(d)});
function setLines(pid,hl,hot,ok){
  document.querySelectorAll(`.ln[data-l^="${pid}:"]`).forEach(el=>{
    const n=+el.dataset.l.split(':')[1];
    el.classList.toggle('hl',(hl||[]).includes(n)); el.classList.toggle('hot',(hot||[]).includes(n)); el.classList.toggle('ok',(ok||[]).includes(n));
  });
}
function render(){
  const s=STEPS[si]||{};
  // panels
  C.panels.forEach(p=>{
    const st=(s.panels||{})[p.id]||{}; const el=$('p-'+p.id);
    el.classList.toggle('on',!!st.on&&!st.hot&&!st.good); el.classList.toggle('hot',!!st.hot); el.classList.toggle('good',!!st.good); el.classList.toggle('hidden',!!st.hidden);
    if(p.kind==='code') setLines(p.id,st.hl,st.hotl,st.okl);
    const b=$('badge-'+p.id); b.className='pbadge'; if(st.badge){b.textContent=st.badge.text;b.classList.add('show',st.badge.cls||'cyan');}
    const tg=$('tag-'+p.id); tg.textContent=st.tag!=null?st.tag:(p.tag||''); tg.classList.toggle('live',!!st.live);
    if(p.kind==='state'&&st.html!=null) $('s-'+p.id).innerHTML=st.html;
    if(p.kind==='state'&&st.html==null){ // fall back to the latest html set by an earlier step
      let h=p.html||''; for(let i=0;i<=si;i++){const x=((STEPS[i].panels||{})[p.id]||{}); if(x.html!=null) h=x.html;} $('s-'+p.id).innerHTML=h; }
  });
  // terminals: cumulative lines by key
  C.panels.filter(p=>p.kind==='term').forEach(p=>{
    const keys=[]; let reset=-1;
    for(let i=0;i<=si;i++){const t=(STEPS[i].term||{})[p.id]; if(!t) continue; const arr=Array.isArray(t)?t:t.lines||[]; if(t.clear||(!Array.isArray(t)&&t.clear)) {keys.length=0;} arr.forEach(k=>keys.push([k,i]));}
    const t=$('t-'+p.id); const cur=(s.term||{})[p.id]; const curN=cur?(Array.isArray(cur)?cur.length:(cur.lines||[]).length):0;
    t.innerHTML=(keys.length?keys.map(([k,i])=>{const L=C.lines[k]||{c:'dim',h:esc(k)};return `<div class="tl ${L.c} ${i<si?'show':''}">${L.h}</div>`;}).join(''):`<div class="tl show dim">${p.welcome||''}</div>`)+(s.recap?'':'<div class="tl show"><span class="cursor"></span></div>');
    requestAnimationFrame(()=>requestAnimationFrame(()=>t.querySelectorAll('.tl').forEach((el,j)=>{if(!el.classList.contains('show'))setTimeout(()=>el.classList.add('show'),120*(j-(keys.length-curN)))})));
  });
  // cards
  C.cards.forEach(c=>{$('c-'+c.id).classList.toggle('show',(s.cards||[]).includes(c.id));});
  // recap
  const r=$('recap'); if(s.recap){r.innerHTML=s.recap;r.classList.add('show');} else r.classList.remove('show');
  // caption
  $('stepNo').innerHTML=`Step <span>${si+1} / ${STEPS.length}</span>`; $('capTitle').innerHTML=s.title||''; $('capText').innerHTML=s.cap||'';
  dots.querySelectorAll('i').forEach((d,i)=>{d.classList.toggle('now',i===si);d.classList.toggle('done',i<si)});
  layoutArrows(s.arrows||[]);
}
/* arrows: from/to = {panel, line?} | {card} | {sel}; side 'r' exits right edge, 'l' left edge */
function rectOf(ref){
  // offset* geometry ignores CSS transforms, so a card measured during its
  // reveal (translateX + scale) still yields its settled position.
  let el=null;
  if(ref.line&&ref.panel) el=document.querySelector(`.ln[data-l="${ref.panel}:${ref.line}"]`);
  else if(ref.panel) el=$('p-'+ref.panel); else if(ref.card) el=$('c-'+ref.card); else if(ref.sel) el=document.querySelector(ref.sel);
  if(!el) return null;
  const stage=$('stage'); let x=0,y=0,n=el;
  while(n&&n!==stage){ x+=n.offsetLeft; y+=n.offsetTop; n=n.offsetParent; }
  return {x:x,y:y,w:el.offsetWidth,h:el.offsetHeight};
}
function layoutArrows(list){
  const svg=$('arrows'); svg.innerHTML='';
  list.forEach((a,i)=>{
    const A=rectOf(a.from), B=rectOf(a.to); if(!A||!B) return;
    const ax=a.fromSide==='l'?A.x-3:A.x+A.w+3, ay=A.y+Math.min(A.h/2,12);
    const bx=a.toSide==='r'?B.x+B.w+3:B.x-3, by=B.y+Math.min(B.h/2,12);
    const mx=a.rail!=null?a.rail:(ax+bx)/2;
    const d=`M${ax},${ay} L${mx},${ay} L${mx},${by} L${bx},${by}`;
    const p=document.createElementNS('http://www.w3.org/2000/svg','path'); p.setAttribute('d',d); p.setAttribute('class','show '+(a.cls||'cy')); svg.appendChild(p);
    if(a.label){const tx=mx, ty=(ay+by)/2; const bg=document.createElementNS('http://www.w3.org/2000/svg','rect'); const w=a.label.length*7.2+14; bg.setAttribute('x',tx-w/2);bg.setAttribute('y',ty-10);bg.setAttribute('width',w);bg.setAttribute('height',20);bg.setAttribute('rx',5);bg.setAttribute('class','show'); svg.appendChild(bg);
      const t=document.createElementNS('http://www.w3.org/2000/svg','text'); t.setAttribute('x',tx);t.setAttribute('y',ty+4);t.setAttribute('text-anchor','middle');t.setAttribute('class','show');t.textContent=a.label; svg.appendChild(t);}
  });
}
function go(i){si=Math.max(0,Math.min(STEPS.length-1,i));render();if(playing)schedule()}
function next(){if(si<STEPS.length-1)go(si+1);else pause()}
function prev(){go(si-1)}
function schedule(){clearTimeout(timer);clearInterval(progT);const d=(STEPS[si].dur||5000)/parseFloat($('speed').value);const t0=Date.now();$('prog').style.width='0';progT=setInterval(()=>{$('prog').style.width=Math.min(100,(Date.now()-t0)/d*100)+'%'},100);timer=setTimeout(()=>{if(si<STEPS.length-1){go(si+1)}else pause()},d)}
function play(){playing=true;$('bPlay').textContent='❚❚ Pause';schedule()}
function pause(){playing=false;$('bPlay').textContent='▶ Play';clearTimeout(timer);clearInterval(progT);$('prog').style.width='0'}
$('bPlay').onclick=()=>playing?pause():play(); $('bNext').onclick=()=>{pause();next()}; $('bPrev').onclick=()=>{pause();prev()}; $('bRst').onclick=()=>{pause();go(0)};
$('speed').onchange=()=>{if(playing)schedule()};
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT')return;
  if(e.key===' '){e.preventDefault();playing?pause():play()}
  else if(e.key==='ArrowRight'||e.key==='PageDown'){pause();next()}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){pause();prev()}
  else if(e.key==='Home'){pause();go(0)} else if(e.key==='End'){pause();go(STEPS.length-1)}
  else if(e.key==='r'||e.key==='R'){pause();go(0)}
  else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
});
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);const st=$('stage');st.style.transform=`scale(${s})`;st.style.left=((innerWidth-1280*s)/2)+'px';st.style.top=((innerHeight-720*s)/2)+'px';layoutArrows((STEPS[si]||{}).arrows||[])}
addEventListener('resize',fit);
['transitionend'].forEach(function(evn){ $('cards').addEventListener(evn,function(){ layoutArrows((STEPS[si]||{}).arrows||[]); }); $('panels').addEventListener(evn,function(){ layoutArrows((STEPS[si]||{}).arrows||[]); }); });
const q=new URLSearchParams(location.search);
if(q.has('noanim')) $('stage').classList.add('noanim');
fit(); go(q.has('step')?(+q.get('step')-1):0);
if(q.has('autoplay')||(C.meta.autoplay&&!q.has('paused')))play();
window.__concept={steps:STEPS,go:go};
})();
</script>
