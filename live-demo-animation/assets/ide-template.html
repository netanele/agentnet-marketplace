<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400;1,700&family=Heebo:wght@400;500;700&display=swap">
<style>
  /* ── The IDE: Claude Code desktop, three panes ──────────────────────────
     Every colour below was picked off real screenshots of the app
     (assets/reference/*.png). Change them only against a new screenshot. */
  :root{
    --sb-bg:#0c0f14; --sb-border:#1c2129; --sb-text:#c9d1d9; --sb-dim:#8b949e;
    --sb-search-bg:#161b22; --sb-search-border:#30363d; --sb-sel:#1f242b;
    --folder:#4d8ef5; --root-icon:#d0d7de;
    --cc-bg:#000000; --cc-text:#e6e6e6; --cc-dim:#9a9a9a; --cc-faint:#5c5c5c;
    --cc-hr:#6b6b6b; --cc-human-bg:#1a1a1a; --cc-accent:#e5645a; --cc-tool:#e5645a;
    --cc-cyan:#39c5cf; --cc-magenta:#d977c9; --cc-green:#3fb950; --cc-yellow:#e3b341;
    --cc-pink:#f4a0c0; --cc-code:#6cb6ff; --cc-cursor:#3fb950;
    --scrollthumb:#4a7ede;
    --split:#e3dccb;
    --tp-bg:#000000; --tp-btn:#1a1a1a; --tp-btn-border:#3a3a3a; --tp-text:#dddddd;
    --tp-sel:#182636; --tp-icon:#58a6ff; --tp-arrow:#3fb950; --tp-name:#39c5cf; --tp-cmd:#3fb950;
    --vw-bg:#f5f0e6; --vw-ln:#8a8a8a; --vw-text:#2b2b2b; --vw-kw:#c8213a; --vw-id:#6f42c1;
    --vw-str:#3f7d2c; --vw-cm:#7a7a7a; --vw-num:#1a5fb4; --vw-hl:rgba(255,190,0,.17);
    --vw-tab-bg:#ebe5d8; --vw-tab-border:#d8d1c2;
    --ctl-bg:#0a1f3d; --ctl-text:#dce6f1; --ctl-accent:#00c8ff; --ctl-border:#1e4d8b;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --fs:13px; --lh:1.5;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#000}
  body{font-family:var(--mono);font-size:var(--fs);line-height:var(--lh);color:var(--cc-text);overflow:hidden}
  .app{height:100%;display:flex;flex-direction:column}

  /* ── stage (the IDE window) ─────────────────────────────────────────── */
  .stage{position:relative;flex:1 1 auto;min-height:0;display:flex;overflow:hidden;background:var(--cc-bg)}

  /* sidebar */
  .sidebar{flex:0 0 var(--sb-w,236px);width:var(--sb-w,236px);min-width:0;overflow:hidden;background:var(--sb-bg);border-right:1px solid var(--sb-border);display:flex;flex-direction:column;min-height:0}
  .sb-search{margin:10px 10px 8px;height:30px;border:1px solid var(--sb-search-border);background:var(--sb-search-bg);border-radius:6px;color:var(--sb-dim);font-size:12.5px;display:flex;align-items:center;padding:0 10px;user-select:none}
  .tree{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:2px 0 14px}
  .tree::-webkit-scrollbar{width:8px}.tree::-webkit-scrollbar-thumb{background:#2a2f37;border-radius:4px}
  .row{display:flex;align-items:center;height:20px;padding-right:8px;white-space:nowrap;overflow:hidden;min-width:0;color:var(--sb-text);font-size:12.5px;cursor:default;position:relative}
  .row.sel{background:var(--sb-sel)}
  .row .chev{width:16px;flex:0 0 16px;color:var(--sb-dim);text-align:center;font-size:11px}
  .row .chev.open{transform:rotate(90deg)}
  .row .ico{width:18px;flex:0 0 18px;height:14px;margin-right:6px;display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;letter-spacing:-.02em;line-height:1;border-radius:2px}
  .row .nm{overflow:hidden;text-overflow:ellipsis}
  .ico-folder{width:14px!important;height:11px;background:var(--folder);border-radius:2px;position:relative;margin-left:2px;margin-right:8px!important}
  .ico-folder::before{content:"";position:absolute;left:0;top:-3px;width:6px;height:3px;background:var(--folder);border-radius:2px 2px 0 0}
  .ico-folder.git{background:#e8853a}.ico-folder.git::before{background:#e8853a}
  .ico-folder.npm{background:#7cbf4a}.ico-folder.npm::before{background:#7cbf4a}
  .ico-folder.src{background:transparent;border:1.5px solid #9aa4b2;height:12px}.ico-folder.src::before{display:none}
  .ico-folder.styles{background:#7bc86c}.ico-folder.styles::before{background:#7bc86c}
  .ico-folder.claude{background:#d97757}.ico-folder.claude::before{background:#d97757}
  .ico-root{color:var(--root-icon);border:1.5px solid var(--root-icon);border-radius:3px;width:16px!important;height:13px;font-size:8px}
  .ico-md{background:#3b82f6;color:#fff}.ico-json{color:#e8e8e8;font-size:10px}.ico-html{color:#e8853a;font-size:11px}
  .ico-npm{background:#cb3837;color:#fff;font-size:7.5px}.ico-ts{color:#3b82f6;font-size:11px}.ico-tsx{color:#3fc5e8;font-size:13px}
  .ico-git{color:#f05033;font-size:12px}.ico-py{color:#3b82f6;font-size:10px}.ico-sh{color:#7ee787;font-size:11px}.ico-yml{color:#c084fc;font-size:11px}
  .ico-txt{color:#9aa4b2;font-size:10px}.ico-css{color:#60a5fa;font-size:10px}.ico-toml{color:#9aa4b2;font-size:9px}.ico-lock{color:#9aa4b2;font-size:10px}

  /* main column */
  .main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;position:relative}
  .editor{flex:1 1 auto;min-height:0;position:relative;display:flex;flex-direction:column}
  .lthumb{position:absolute;left:0;top:0;width:6px;background:var(--scrollthumb);border-radius:0 3px 3px 0;z-index:3;pointer-events:none}

  /* Claude Code pane */
  .cc{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--cc-bg)}
  .cc[hidden]{display:none}
  .cc-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;padding:14px 22px 6px 26px;scroll-behavior:auto}
  .cc-scroll::-webkit-scrollbar{width:0}
  .cc-ev{margin:0 0 14px;white-space:pre-wrap;word-break:break-word}
  .cc-ev[hidden]{display:none}
  .cc-human{background:var(--cc-human-bg);border-radius:4px;padding:5px 10px;color:var(--cc-text)}
  .cc-human .chev{color:var(--cc-dim);margin-right:8px;font-weight:700}
  .cc-msg{display:flex;gap:10px}.cc-msg .dot{flex:0 0 auto;color:var(--cc-text)}.cc-msg.pink .dot{color:var(--cc-pink)}
  .cc-msg .body{flex:1 1 auto;min-width:0}
  .cc-msg .body strong{color:var(--cc-text);font-weight:700}
  .cc-msg .body em{font-style:italic}
  .cc-msg .body code{color:var(--cc-code);font-family:inherit}
  .cc-msg .body .h{color:var(--cc-accent);font-weight:700}
  .cc-tool .head{color:var(--cc-text)}
  .cc-tool .head .tname{color:var(--cc-tool);font-weight:700}
  .cc-tool .res{color:var(--cc-dim);padding-left:24px;position:relative}
  .cc-tool .res .elbow{color:var(--cc-faint);position:absolute;left:3px;top:0}
  .cc-tool .res.ok{color:var(--cc-green)}.cc-tool .res.warn{color:var(--cc-accent)}
  .cc-tool[hidden]{display:none}
  .diffblock{margin:4px 0 0 18px;font-size:12.5px}
  .diffrow{display:flex}.diffrow[hidden]{display:none}
  .diffnum{width:36px;flex:0 0 auto;text-align:right;padding-right:10px;color:var(--cc-faint)}
  .diffmarker{width:14px;flex:0 0 auto;text-align:center;color:var(--cc-faint)}
  .difftext{flex:1;white-space:pre-wrap;color:var(--cc-dim)}
  .diffrow-add{background:#123a1c}.diffrow-add .diffmarker{color:var(--cc-green);font-weight:700}.diffrow-add .difftext{color:#bfe9bf}
  .diffrow-del{background:#3a1414}.diffrow-del .diffmarker{color:var(--cc-accent);font-weight:700}.diffrow-del .difftext{color:#f0c2c2}
  .cc-spin{color:var(--cc-dim)}.cc-spin .g{color:var(--cc-accent);display:inline-block;width:1.2em}
  .cc-done{color:var(--cc-dim)}.cc-done .g{color:var(--cc-dim)}
  .cc-welcome{border:1px solid #3a3a3a;border-radius:6px;padding:8px 12px;display:inline-block;min-width:360px;color:var(--cc-text)}
  .cc-welcome .star{color:var(--cc-accent)}.cc-welcome .dim{color:var(--cc-dim)}.cc-welcome b{font-weight:700}
  .cc-right{text-align:right;color:var(--cc-green)}
  .cc-cursor{display:inline-block;width:.62em;height:1.15em;border:1.5px solid var(--cc-cursor);border-radius:2px;vertical-align:-3px;margin-left:1px}
  .cc-cursor.off{opacity:0}
  .cc-bottom{flex:0 0 auto;padding:0 22px 8px 22px}
  .cc-hr{height:1px;background:var(--cc-hr);margin:6px 0 10px}
  .cc-input{white-space:pre-wrap;word-break:break-word;min-height:1.5em;padding-left:4px}
  .cc-input .p{color:var(--cc-text);font-weight:700;margin-right:6px}
  .cc-input .chip{color:var(--cc-cyan);margin-right:8px}
  .cc-status{margin-top:10px;color:var(--cc-dim);white-space:pre;overflow:hidden}
  .cc-status .arrow{color:var(--cc-dim);margin-right:8px}
  .cc-status .proj{color:var(--cc-cyan);font-weight:700}
  .cc-status .model{color:var(--cc-magenta)}
  .cc-status .bar{color:var(--cc-green);letter-spacing:-.5px}.cc-status .bar .e{color:#1f3d25}
  .cc-status .pct{color:var(--cc-green)}
  .cc-status .mode{color:var(--cc-yellow);font-weight:700}.cc-status .modehint{color:#a88b3a}

  /* File viewer */
  .vw{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--vw-bg);color:var(--vw-text)}
  .vw[hidden]{display:none}
  .vw-tabs{flex:0 0 auto;display:flex;background:var(--vw-tab-bg);border-bottom:1px solid var(--vw-tab-border);height:30px;padding-left:8px}
  .vw-tab{display:flex;align-items:center;gap:8px;padding:0 12px;font-size:12px;color:#3a3a3a;background:var(--vw-bg);border-right:1px solid var(--vw-tab-border);border-left:1px solid var(--vw-tab-border);height:100%}
  .vw-tab .x{color:#8a8a8a;font-size:13px}
  .vw-body{flex:1 1 auto;min-height:0;overflow:auto;padding:8px 0 40px}
  .vw-body::-webkit-scrollbar{width:10px}.vw-body::-webkit-scrollbar-thumb{background:#d5cfc1;border-radius:5px}
  .vw-line{display:flex;min-height:19px;line-height:19px;white-space:pre}
  .vw-line .ln{flex:0 0 58px;text-align:right;padding-right:22px;color:var(--vw-ln);user-select:none}
  .vw-line .code{flex:1 1 auto;padding-right:24px}
  .vw-line.hl{background:var(--vw-hl)}
  .kw{color:var(--vw-kw)}.id{color:var(--vw-id)}.str{color:var(--vw-str)}.cm{color:var(--vw-cm);font-style:normal}.num{color:var(--vw-num)}.pn{color:var(--vw-text)}

  /* terminal panel */
  .split{flex:0 0 2px;background:var(--split)}
  .tp{flex:0 0 var(--tp-h,34%);display:flex;background:var(--tp-bg);min-height:0}
  .tp-left{flex:0 0 174px;border-right:1px solid #2a2a2a;display:flex;flex-direction:column}
  .tp-tools{display:flex;gap:5px;padding:8px 8px 6px;align-items:center}
  .tp-btn{height:26px;min-width:26px;padding:0 6px;border:1px solid var(--tp-btn-border);background:var(--tp-btn);border-radius:6px;color:var(--tp-text);font-size:12.5px;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .tp-btn .n{color:#bdbdbd;font-size:11.5px}
  .tp-tabs{flex:1 1 auto;overflow:hidden;padding-top:2px}
  .tp-tab{display:flex;align-items:center;height:30px;padding:0 10px 0 12px;color:var(--tp-text);font-size:12.5px;gap:8px}
  .tp-tab.sel{background:var(--tp-sel)}
  .tp-tab .ti{color:var(--tp-icon);font-weight:700;font-size:11px}
  .tp-tab .tn{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tp-tab .tx{color:#9a9a9a}
  .tp-right{flex:1 1 auto;min-width:0;overflow-y:auto;padding:8px 12px 12px 10px}
  .tp-right::-webkit-scrollbar{width:0}
  .tp-out{white-space:pre-wrap;word-break:break-word;color:var(--cc-text)}
  .tp-out .pr{color:var(--tp-arrow);font-weight:700;margin-right:8px}
  .tp-out .pn{color:var(--tp-name);font-weight:700;margin-right:8px}
  .tp-out .cmd{color:var(--tp-cmd)}
  .sp8{margin-right:8px}.gb{color:#4a8cff;font-weight:700}.gbn{color:#e5484d;font-weight:700}.gx{color:#e3b341;font-weight:700}
  .tp-out .ok{color:var(--cc-green)}.tp-out .err{color:var(--cc-accent)}.tp-out .dim{color:var(--cc-dim)}.tp-out .cyan{color:var(--cc-cyan)}.tp-out .yellow{color:var(--cc-yellow)}.tp-out .bold{font-weight:700}
  .tp-cursor{display:inline-block;width:.62em;height:1.15em;background:#d0d0d0;vertical-align:-3px}
  .tp-cursor.off{opacity:.15}

  /* pointer */
  .pointer{position:absolute;left:0;top:0;width:18px;height:24px;z-index:20;pointer-events:none;transform:translate(-200px,-200px);transition:transform 520ms cubic-bezier(.35,.1,.25,1);filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.6))}
  .pointer.nomove{transition:none}
  .pointer.click{animation:clk 220ms ease-out}
  @keyframes clk{0%{scale:1}40%{scale:.82}100%{scale:1}}
  .pointer.hidden{opacity:0}

  /* caption strip — sits between the IDE and the controls so it never covers the app */
  .caption{flex:0 0 auto;min-height:38px;display:flex;align-items:center;justify-content:center;text-align:center;padding:7px 18px;background:#0e2138;color:#fff;font-family:Heebo,system-ui,sans-serif;font-size:15px;line-height:1.35;border-top:1px solid #1e4d8b;transition:opacity 200ms}
  .caption.off{display:none}
  .caption:empty::before{content:"\00a0"}
  .caption b{color:var(--ctl-accent)}
  .caption code{font-family:var(--mono);font-size:13.5px;color:#dce6f1;background:rgba(255,255,255,.08);padding:0 5px;border-radius:4px}

  /* player controls (RavTech navy — this bar is the only non-IDE chrome) */
  .controls{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:7px 12px;background:var(--ctl-bg);border-top:1px solid var(--ctl-border);color:var(--ctl-text);font-family:Heebo,system-ui,sans-serif;font-size:12.5px}
  .controls button{font-family:inherit;font-size:12.5px;color:var(--ctl-text);background:transparent;border:1px solid var(--ctl-border);border-radius:6px;padding:4px 10px;cursor:pointer}
  .controls button:hover{border-color:var(--ctl-accent)}
  #playBtn{width:34px;height:30px;padding:0;background:var(--ctl-accent);color:#0a1f3d;border-color:var(--ctl-accent);font-weight:700}
  .controls .sp{display:flex;align-items:center;gap:6px}
  .controls input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:#1e4d8b;flex:1;min-width:0}
  .controls input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;background:var(--ctl-accent);cursor:pointer;border:none}
  .controls input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--ctl-accent);border:none}
  #scrub{flex:1 1 200px}
  #stepLabel{font-variant-numeric:tabular-nums;color:#7c8aa3;white-space:nowrap}
  .controls .title{color:#fff;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
  .controls .keys{color:#7c8aa3;white-space:nowrap}
  .controls .deeplink{color:var(--ctl-accent);text-decoration:none;border:1px solid var(--ctl-border);border-radius:6px;padding:4px 10px;white-space:nowrap;font-weight:500}
  .controls .deeplink:hover{border-color:var(--ctl-accent);background:rgba(0,200,255,.08)}
  .controls .deeplink[hidden]{display:none}
  @media (max-width:820px){.controls .keys,.controls .title{display:none}}
  @media (prefers-reduced-motion:reduce){.pointer{transition:none}}
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <div class="sidebar">
      <div class="sb-search">Search in project</div>
      <div class="tree" id="tree"></div>
    </div>
    <div class="main">
      <div class="editor" id="editor">
        <div class="lthumb" id="lthumb"></div>
        <div class="cc" id="cc">
          <div class="cc-scroll" id="ccScroll"></div>
          <div class="cc-bottom">
            <div class="cc-hr"></div>
            <div class="cc-input" id="ccInput"></div>
            <div class="cc-status" id="ccStatus"></div>
          </div>
        </div>
        <div class="vw" id="vw" hidden>
          <div class="vw-tabs" id="vwTabs"></div>
          <div class="vw-body" id="vwBody"></div>
        </div>
      </div>
      <div class="split"></div>
      <div class="tp">
        <div class="tp-left">
          <div class="tp-tools">
            <span class="tp-btn"><span>−</span><span class="n">14</span><span>+</span></span>
            <span class="tp-btn" id="tpNew">+</span>
            <span class="tp-btn">⌄</span>
            <span class="tp-btn">⛶</span>
            <span class="tp-btn">⊠</span>
          </div>
          <div class="tp-tabs" id="tpTabs"></div>
        </div>
        <div class="tp-right" id="tpRight"><div class="tp-out" id="tpOut"></div></div>
      </div>
    </div>
    <svg class="pointer" id="pointer" viewBox="0 0 18 24"><path d="M2 1 L2 19 L6.6 14.8 L9.6 22 L12.6 20.8 L9.7 13.8 L16 13.8 Z" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/></svg>
  </div>
  <div class="caption" id="caption"></div>
  <div class="controls">
    <button id="playBtn" type="button" aria-label="Pause">⏸</button>
    <button id="backBtn" type="button" title="Previous step (←)">◀</button>
    <button id="fwdBtn" type="button" title="Next step (→)">▶</button>
    <div class="sp"><span>Speed</span><input type="range" id="speed" min="0" max="4" step="1" value="1" style="width:80px"><span id="speedLabel">1x</span></div>
    <input type="range" id="scrub" min="0" max="1000" step="1" value="0" aria-label="Scrub">
    <span id="stepLabel">0 / 0</span>
    <button id="capBtn" type="button" title="Captions (C)">CC</button>
    <span class="title" id="titleLabel"></span>
    <a class="deeplink" id="deepLink" hidden target="_blank" rel="noopener"></a>
    <span class="keys">Space play · ←/→ step · C captions · R restart</span>
  </div>
</div>
<script id="demoData" type="application/json">{{DATA_JSON}}</script>
<script>
(function(){
"use strict";
var D = JSON.parse(document.getElementById('demoData').textContent);
var META = D.meta || {}, TREE = D.tree || [], FILES = D.files || {}, EVENTS = D.events || [];
var TABS = META.tabs !== false;

function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return c==='&'?'&amp;':c==='<'?'&lt;':'&gt;';});}
function $(id){return document.getElementById(id);}

/* ── markdown-lite for Claude's prose (bold, code, italics, headings) ── */
function mdLite(raw){
  return esc(raw).split('\n').map(function(line){
    var m=line.match(/^(#{1,6})\s+(.*)$/); if(m) return '<span class="h">'+inline(m[2])+'</span>';
    return inline(line);
  }).join('\n');
  function inline(s){
    s=s.replace(/`([^`\n]+?)`/g,'<code>$1</code>');
    s=s.replace(/\*\*([^*\n]+?)\*\*/g,'<strong>$1</strong>');
    s=s.replace(/(^|[\s(])_([^_\n]+?)_(?=[\s).,;:!?]|$)/g,'$1<em>$2</em>');
    return s;
  }
}

/* ── syntax highlighter for the file viewer ─────────────────────────── */
var KW={
  ts:'import export from default const let var function return if else for while do switch case break continue new class extends implements interface type enum async await try catch finally throw typeof instanceof in of as null undefined true false this super static readonly public private protected void never any unknown yield delete',
  py:'import from as def class return if elif else for while in not and or is None True False try except finally raise with lambda yield pass break continue global nonlocal assert del async await',
  sh:'if then else elif fi for do done while case esac in function return export local set echo exit source',
  go:'package import func var const type struct interface return if else for range switch case default break continue go defer chan map select nil true false',
  rs:'fn let mut pub use mod struct enum impl trait for in if else match return where as ref self Self crate super const static unsafe async await move loop while break continue true false'
};
function langOf(path){
  var e=(path.split('.').pop()||'').toLowerCase();
  if(/^(ts|tsx|js|jsx|mjs|cjs)$/.test(e)) return 'ts';
  if(e==='py') return 'py'; if(/^(sh|bash|zsh)$/.test(e)) return 'sh'; if(e==='go') return 'go'; if(e==='rs') return 'rs';
  if(e==='json') return 'json'; if(/^(md|mdx)$/.test(e)) return 'md'; if(/^(yml|yaml)$/.test(e)) return 'yaml'; if(e==='toml') return 'toml';
  if(/^(html|htm|xml|svg)$/.test(e)) return 'html'; if(e==='css') return 'css';
  return 'txt';
}
function hlLine(line, lang){
  if(lang==='md'){
    var h=line.match(/^(#{1,6}\s.*)$/); if(h) return '<span class="kw">'+esc(line)+'</span>';

      if(f<typeShare){ var ff=Math.max(0,(f*item.dur-400))/(cmd.length*(TYPE_MS+8)); S.termTyping=cmd.slice(0,Math.floor(cmd.length*Math.min(1,ff))); S.pointerHidden=f>0.15; }
      else { S.termTyping=null; S.pointerHidden=true;
        var lines=ev.out==null?[]:String(ev.out).split('\n'); var show= f<typeShare+enterShare?0:Math.round((f-typeShare-enterShare)/(1-typeShare-enterShare)*lines.length);
        var rec3=S._tc&&S._tc[i]; if(!rec3){ rec3={cmd:{kind:'cmd',text:cmd},outs:[]}; S._tc=S._tc||{}; S._tc[i]=rec3; S.termLines.push(rec3.cmd); }
        while(rec3.outs.length<show){ var ln=lines[rec3.outs.length]; var o={kind:ev.html?'html':'out',text:ln}; rec3.outs.push(o); S.termLines.push(o); }
      }
      if(f>=0.999 && S.termTabs[S.termSel] && ev.cmd && !ev.keepTab) S.termTabs[S.termSel].name=cmd.split(' ')[0];
      break; }
  }
}
var needScroll=null;
function click(){ ptr.classList.remove('click'); void ptr.offsetWidth; ptr.classList.add('click'); }
function cssq(s){ return String(s).replace(/"/g,'\\"'); }
function depthOf(p){ return p.split('/').length; }
function ensureVisible(path){ var parts=path.split('/'); var acc=''; for(var i=0;i<parts.length-1;i++){ acc=acc?acc+'/'+parts[i]:parts[i]; S.expanded[acc]=true; } }
function addTreeNode(path){
  // Builds a fresh chain of nodes for `path` and merges it into S.treeExtra
  // (never TREE, which is the shared data loaded once at page load and must
  // stay untouched so reset()/backwards-scrub can drop this file again).
  var parts=path.split('/'), chain=null;
  for(var i=parts.length-1;i>=0;i--){
    var node={name:parts[i], kind:i===parts.length-1?'file':'dir'};
    if(chain) node.children=[chain];
    chain=node;
  }
  S.treeExtra=mergeTrees(S.treeExtra, [chain]);
}

/* ── playback ───────────────────────────────────────────────────────── */
var t=0, playing=true, speed=1, speeds=[0.5,1,1.5,2,3], lastTs=null, applied=-1, scrubbing=false, caps=true;
function replayTo(time, hard){
  // hard: rebuild from zero (backwards scrub / restart)
  if(hard){ reset(); applied=-1; ptr.classList.add('nomove'); }
  for(var k=0;k<TL.length;k++){
    var it=TL[k];
    if(it.start+it.dur<=time){ if(applied<k){ apply(it,1); applied=k; } }
    else if(it.start<=time){ apply(it, it.dur?(time-it.start)/it.dur:1); break; }
    else break;
  }
  renderAll();
  if(needScroll!=null && S.openFile){ var row=vwBody.querySelector('.vw-line[data-ln="'+needScroll+'"]'); if(row){ vwBody.scrollTo({top:Math.max(0,row.offsetTop-vwBody.offsetTop-8),behavior:hard?'auto':'smooth'}); } needScroll=null; renderThumb(); }
  if(hard){ void ptr.offsetWidth; ptr.classList.remove('nomove'); }
  var idx=stepIndex(time); $('stepLabel').textContent=(idx+1)+' / '+beats.length;
  if(!scrubbing) $('scrub').value=String(Math.round(TL.total?time/TL.total*1000:0));
  capEl.classList.toggle('off',!caps);
}
var beats=TL.filter(function(it){return it.dur>0;});
function stepIndex(time){ var idx=-1; for(var k=0;k<beats.length;k++){ if(beats[k].start<=time) idx=k; } return idx; }
function setPlaying(p){ playing=p; $('playBtn').textContent=p?'⏸':'▶'; }
function seek(time, hard){ var back=time<t; t=Math.max(0,Math.min(TL.total,time)); replayTo(t, hard||back); }
function tick(ts){
  if(lastTs===null) lastTs=ts; var dt=ts-lastTs; lastTs=ts;
  if(playing){ t+=dt*speed; if(t>=TL.total){ t=TL.total; setPlaying(false); } replayTo(t,false); }
  requestAnimationFrame(tick);
}
$('playBtn').addEventListener('click',function(){ if(t>=TL.total){ seek(0,true); } setPlaying(!playing); });
$('backBtn').addEventListener('click',function(){ var idx=stepIndex(t-1); var target=idx>0?beats[idx-1].start:0; if(idx>=0 && t-beats[idx].start>600) target=beats[idx].start; seek(target,true); });
$('fwdBtn').addEventListener('click',function(){ var idx=stepIndex(t); var nx=beats[idx+1]; seek(nx?nx.start:TL.total,false); });
$('speed').addEventListener('input',function(){ speed=speeds[Number(this.value)]; $('speedLabel').textContent=speed+'x'; });
$('scrub').addEventListener('pointerdown',function(){ scrubbing=true; setPlaying(false); });
$('scrub').addEventListener('input',function(){ seek(Number(this.value)/1000*TL.total,true); });
$('scrub').addEventListener('pointerup',function(){ scrubbing=false; });
$('capBtn').addEventListener('click',function(){ caps=!caps; capEl.classList.toggle('off',!caps); });
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT') return;
  if(e.code==='Space'){ e.preventDefault(); $('playBtn').click(); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); $('fwdBtn').click(); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); $('backBtn').click(); }
  else if(e.key==='c'||e.key==='C'){ $('capBtn').click(); }
  else if(e.key==='r'||e.key==='R'){ seek(0,true); setPlaying(true); }
  else if(e.key==='f'||e.key==='F'){ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); }
});
window.addEventListener('resize',function(){ renderPointer(); renderThumb(); });
$('titleLabel').textContent=META.title||'';
if(META.deepDive&&META.deepDive.href){ var dl=$('deepLink'); dl.href=META.deepDive.href; dl.textContent='📄 '+(META.deepDive.label||'Deep dive')+' ↗'; dl.hidden=false; }
document.title=META.title||document.title;
var qs=new URLSearchParams(location.search);
reset(); replayTo(0,true);
if(qs.get('t')){ seek(Number(qs.get('t')),true); }
if(qs.get('step')){ var b=beats[Number(qs.get('step'))-1]; if(b){ var fr=qs.get('frac')!=null?Number(qs.get('frac')):1; seek(b.start+Math.min(b.dur,Math.max(0,b.dur*fr-(fr>=1?1:0))),true); } }
window.__demo={beats:beats,total:TL.total,seek:seek,state:function(){return S;}};
if(qs.get('paused')==='1'||qs.get('step')||qs.get('t')) setPlaying(false); else setPlaying(META.autoplay!==false);
requestAnimationFrame(tick);
})();
</script>
